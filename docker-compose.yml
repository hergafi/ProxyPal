services:
  proxypal:
    build: .
    container_name: proxypal
    # Loopback only: the gateway is for this machine, not the public internet.
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      GATEWAY_CONFIG: /data/gateway_config.json
      DB_PATH: /data/gateway.db
      WORKSPACE_ROOT: /workspace
      ALLOWED_ORIGINS: http://127.0.0.1:8790,http://localhost:8790
      # Optional fixed secret. When empty the gateway generates one on first start
      # and stores it in data/.gateway_token on the host.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
    volumes:
      - ./gateway_config.json:/data/gateway_config.json
      - ./gateway.db:/data/gateway.db
      - ./data:/app/data
      # Read-only project view for the "load workspace" feature.
      - ./workspace:/workspace:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped